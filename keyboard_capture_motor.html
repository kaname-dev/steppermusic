<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鍵盤キャプチャ・モーター演奏</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2230;
      --text: #e8eef7;
      --muted: #8b97ab;
      --accent: #5cc8ff;
      --danger: #ff6b7a;
      --ok: #7af5c8;
      --warn: #ffd56a;
    }
    html {
      height: 100%;
      scrollbar-gutter: stable;
    }
    body {
      margin: 0;
      height: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #2a3548;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, label.filebtn {
      background: linear-gradient(180deg, #2c3b55 0%, #243147 100%);
      border: 1px solid #3d4f6d;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover, label.filebtn:hover { border-color: var(--accent); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.primary {
      background: linear-gradient(180deg, #1e6eab 0%, #165980 100%);
      border-color: #3a9fd4;
    }
    button.danger { border-color: #c94857; color: #ffd0d5; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr min(360px, 34vw);
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(200px, 1fr) minmax(0, 1fr);
      }
    }
    .stage-wrap {
      position: relative;
      background: #000;
      overflow: hidden;
      min-height: 0;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
    }
    video#cap {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      vertical-align: top;
      background: #111;
    }
    canvas#overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      cursor: default;
    }
    aside {
      background: var(--panel);
      border-left: 1px solid #2a3548;
      padding: 12px;
      min-height: 0;
      align-self: stretch;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 900px) {
      aside { border-left: none; border-top: 1px solid #2a3548; }
    }
    aside h2 {
      margin: 0 0 10px;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }
    fieldset {
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid #2f3d54;
      border-radius: 10px;
    }
    legend { padding: 0 6px; font-size: 12px; color: var(--muted); }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    label.small { font-size: 12px; color: var(--muted); }
    input[type="color"] {
      width: 36px;
      height: 28px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    input[type="range"] { flex: 1; min-width: 120px; }
    select, input[type="number"] {
      background: #0f141c;
      color: var(--text);
      border: 1px solid #39475f;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
    }
    .keys-list {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #2f3d54;
      border-radius: 8px;
    }
    .keys-list table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .keys-list th, .keys-list td {
      padding: 6px 8px;
      border-bottom: 1px solid #2a3548;
      text-align: left;
    }
    .keys-list tr.active td:first-child {
      border-left: 3px solid var(--ok);
    }
    .keys-list tr.inactive td:first-child {
      border-left: 3px solid transparent;
    }
    .delta { font-variant-numeric: tabular-nums; color: var(--muted); }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
    }
    .on { background: var(--ok); box-shadow: 0 0 8px rgba(122,245,200,.55); }
    .off { background: #3d4f6d; }
    .serial-status {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }
    .serial-status.ok { background: rgba(122,245,200,.12); color: var(--ok); }
    .serial-status.err { background: rgba(255,107,122,.12); color: var(--danger); }
    .serial-status.info { background: rgba(92,200,255,.1); color: var(--accent); }
    .motor-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      font-size: 12px;
    }
    .motor-notes .chip {
      background: #0f141c;
      border: 1px solid #39475f;
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--ok);
    }
    .motor-notes.empty { color: var(--muted); }
    footer {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid #2a3548;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>鍵盤キャプチャ・モーター演奏</h1>
    <div class="toolbar">
      <button type="button" id="btnShare" class="primary">画面を共有</button>
      <button type="button" id="btnStop" disabled>共有停止</button>
      <span class="toolbar" style="margin-left:4px;">
        <button type="button" id="btnGroupMoveToggle">グループ位置: オフ</button>
        <button type="button" id="btnKeyHandlesToggle">鍵を微調整: オフ</button>
        <button type="button" id="btnClearRects">すべて削除</button>
      </span>
      <button type="button" id="btnMidiConnect">MIDI 接続</button>
      <span id="midiStatus" style="font-size: 12px; color: var(--muted);">接続なし</span>
      <button type="button" id="btnExport">マッピング JSON 出力</button>
      <label class="filebtn">
        JSON 読込
        <input type="file" id="fileImport" accept="application/json" hidden />
      </label>
    </div>
  </header>
  <main>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <video id="cap" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>
    <aside>
      <h2>既定色・検出</h2>
      <fieldset>
        <legend>標準 RGB</legend>
        <div class="row">
          <span class="small">白鍵</span>
          <input type="color" id="colWhite" value="#eae8dc" />
          <input type="number" id="numWr" min="0" max="255" step="1" style="width:56px;" aria-label="白 R" />
          <input type="number" id="numWg" min="0" max="255" step="1" style="width:56px;" aria-label="白 G" />
          <input type="number" id="numWb" min="0" max="255" step="1" style="width:56px;" aria-label="白 B" />
        </div>
        <div class="row">
          <span class="small">黒鍵</span>
          <input type="color" id="colBlack" value="#2a2a2a" />
          <input type="number" id="numBr" min="0" max="255" step="1" style="width:56px;" aria-label="黒 R" />
          <input type="number" id="numBg" min="0" max="255" step="1" style="width:56px;" aria-label="黒 G" />
          <input type="number" id="numBb" min="0" max="255" step="1" style="width:56px;" aria-label="黒 B" />
        </div>
        <div class="row">
          <label class="small" for="rngTh">色差閾値</label>
          <input type="range" id="rngTh" min="4" max="120" value="28" />
          <span id="lblTh">28</span>
        </div>
        <div class="row">
          <button type="button" id="btnSampleDefaults">現在フレームで標準色を自動取得</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>鍵盤範囲から自動配置</legend>
        <div class="row">
          <label class="small" for="selStripeStart">左端の音（半音）</label>
          <select id="selStripeStart">
            <option value="0" selected>C（ド）</option>
            <option value="1">C#（ド#）</option>
            <option value="2">D（レ）</option>
            <option value="3">D#（レ#）</option>
            <option value="4">E（ミ）</option>
            <option value="5">F（ファ）</option>
            <option value="6">F#（ファ#）</option>
            <option value="7">G（ソ）</option>
            <option value="8">G#（ソ#）</option>
            <option value="9">A（ラ）</option>
            <option value="10">A#（ラ#）</option>
            <option value="11">B（シ）</option>
          </select>
        </div>
        <div class="row">
          <button type="button" id="btnRangeDraw">鍵盤範囲を指定: オフ</button>
          <button type="button" id="btnPickC4" disabled>C4を指定</button>
        </div>
        <div class="row small" id="lblRangeResult">未認識</div>
      </fieldset>
      <fieldset>
        <legend>モーター演奏（Arduino）</legend>
        <div class="row">
          <button type="button" id="btnArduinoConnect" class="primary">Arduino 接続</button>
          <button type="button" id="btnArduinoDisconnect" disabled>切断</button>
          <button type="button" id="btnArduinoReset" disabled>リセット</button>
        </div>
        <div id="serialStatus" class="serial-status info" hidden>接続待機中…</div>
        <div class="row">
          <label class="small">
            <input type="checkbox" id="chkPolyPhony" checked />
            ポリフォニー（2 音同時まで）
          </label>
        </div>
        <div class="row">
          <span class="small">アクティブノート</span>
        </div>
        <div id="activeMotors" class="motor-notes empty">—</div>
      </fieldset>
      <fieldset>
        <legend>MIDI 収録</legend>
        <div class="row">
          <label class="small" for="numRecPlaybackSpeed">収録時の動画速度</label>
          <input type="number" id="numRecPlaybackSpeed" min="0.05" max="1" step="0.05" value="1" style="width:72px;" />
        </div>
        <div class="row">
          <button type="button" id="btnMidiRecStart" disabled>収録開始</button>
          <button type="button" id="btnMidiRecStop" disabled>収録停止と MIDI 保存</button>
        </div>
        <div class="row small" id="lblMidiRec" hidden></div>
      </fieldset>
      <h2>検出状態</h2>
      <div class="keys-list">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>種類</th>
              <th>Δ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="keyRows"></tbody>
        </table>
      </div>
    </aside>
  </main>
  <footer>
    ブラウザの画面共有のみ使用します（サーバー送信なし）。Chrome / Edge を推奨。
    ● 照明や圧縮アーティファクトにより誤検出する場合は閾値と矩形を調整してください。
    ● 「Arduino 接続」で steppermusic.ino とシリアル接続し、検出した鍵をリアルタイムでモーター演奏できます。
  </footer>

  <canvas id="sampleCv" hidden></canvas>

  <script>
(() => {
  const video = document.getElementById("cap");
  const overlay = document.getElementById("overlay");
  const stage = document.getElementById("stage");
  const octx = overlay.getContext("2d", { willReadFrequently: true });
  const sampleCv = document.getElementById("sampleCv");
  const sctx = sampleCv.getContext("2d", { willReadFrequently: true });

  const btnShare = document.getElementById("btnShare");
  const btnStop = document.getElementById("btnStop");
  const btnGroupMoveToggle = document.getElementById("btnGroupMoveToggle");
  const btnKeyHandlesToggle = document.getElementById("btnKeyHandlesToggle");
  const btnClearRects = document.getElementById("btnClearRects");
  const btnExport = document.getElementById("btnExport");
  const fileImport = document.getElementById("fileImport");
  const colWhite = document.getElementById("colWhite");
  const colBlack = document.getElementById("colBlack");
  const numWr = document.getElementById("numWr");
  const numWg = document.getElementById("numWg");
  const numWb = document.getElementById("numWb");
  const numBr = document.getElementById("numBr");
  const numBg = document.getElementById("numBg");
  const numBb = document.getElementById("numBb");
  const rngTh = document.getElementById("rngTh");
  const lblTh = document.getElementById("lblTh");
  const btnSampleDefaults = document.getElementById("btnSampleDefaults");
  const selStripeStart = document.getElementById("selStripeStart");
  const btnRangeDraw = document.getElementById("btnRangeDraw");
  const lblRangeResult = document.getElementById("lblRangeResult");
  const keyRows = document.getElementById("keyRows");
  const btnPickC4 = document.getElementById("btnPickC4");
  const btnMidiRecStart = document.getElementById("btnMidiRecStart");
  const btnMidiRecStop = document.getElementById("btnMidiRecStop");
  const lblMidiRec = document.getElementById("lblMidiRec");
  const numRecPlaybackSpeed = document.getElementById("numRecPlaybackSpeed");
  const btnMidiConnect = document.getElementById("btnMidiConnect");
  const midiStatus = document.getElementById("midiStatus");
  const btnArduinoConnect = document.getElementById("btnArduinoConnect");
  const btnArduinoDisconnect = document.getElementById("btnArduinoDisconnect");
  const btnArduinoReset = document.getElementById("btnArduinoReset");
  const serialStatus = document.getElementById("serialStatus");
  const chkPolyPhony = document.getElementById("chkPolyPhony");
  const activeMotorsEl = document.getElementById("activeMotors");

  let stream = null;
  // Web Serial API（Arduino モーター）
  let serialPort = null;
  let serialReader = null;
  let serialWriter = null;
  let motorRealtimeEnabled = false;
  /** @type {Map<number, number>} motorNum -> midiNote */
  const activeMotors = new Map();
  /** @type {Map<number, number>} midiNote -> motorNum */
  const notesOnMotors = new Map();
  /** @type {Map<number, number>} keyId -> motorNum */
  const keysOnMotors = new Map();
  /** @type {Map<number, number>} motorNum -> keyId */
  const motorKeyOwners = new Map();
  /** @type {Map<number, boolean>} リアルタイムモーター送信用の前フレーム状態 */
  let motorRealtimePrevOn = new Map();
  /** シリアル送信を直列化し、Note On 完了前の Note Off 取りこぼしを防ぐ */
  let motorSerialQueue = Promise.resolve();
  // Web MIDI API
  let midiAccess = null;
  let midiOutputs = [];
  let currentMidiOutput = null;
  let realtimeMidiEnabled = false;
  /** @type {Map<number, boolean>} リアルタイム MIDI 送信用の前フレーム状態 */
  let midiRealtimePrevOn = new Map();
  /** ON のとき任意の鍵をドラッグすると全鍵が同じ量だけ並進（画面上の位置合わせ用） */
  let groupMoveKeys = false;
  let showKeyHandles = false;
  /** ON のとき次にクリックした鍵を C4（MIDI 60）として全体に半音割当 */
  let pickC4Mode = false;
  /** ユーザーが指定した C4 対応鍵の id。buildMidiNoteMap がこれを 60、左へ半音ずつ減算して記録する */
  let midiC4KeyId = null;
  let dragKind = null; // null | move | resize | moveGroup | range
  /** 鍵盤の高さ範囲をドラッグして白鍵・黒鍵を自動配置するモード */
  let rangeDrawMode = false;
  /** @type {{ nx: number; ny: number; nw: number; nh: number } | null} */
  let rangeDraft = null;
  /** 範囲ドラッグ直後の dblclick で白黒が切り替わらないようにする */
  let ignoreNextDblClick = false;
  let resizeHandle = null; // nw,ne,se,sw
  /** @type {{ nx: number; ny: number; nw: number; nh: number; kind: 'white'|'black'; id: number; midiNote?: number }[]} */
  let keys = [];
  let activeIndex = null;
  let nextId = 1;
  const dragRef = {
    ix: -1,
    startClientX: 0,
    startClientY: 0,
    nx0: 0, ny0: 0, nw0: 0, nh0: 0,
    /** @type {{ nx: number; ny: number }[] | null} 並進ドラッグ開始時の鍵ごとの左上角 */
    snapForGroup: null,
  };

  function syncOverlayCursorStyle() {
    if (rangeDrawMode || dragKind === "range" || pickC4Mode) {
      overlay.style.cursor = "crosshair";
      return;
    }
    if (dragKind === "moveGroup") {
      overlay.style.cursor = "grabbing";
      return;
    }
    overlay.style.cursor = groupMoveKeys && keys.length ? "grab" : "default";
  }

  /** 鍵矩形と動画正規化領域 [0,1]² の交差面積 ÷ 鍵面積（画面外寄りは検出しない判定に使用） */
  function keyVideoOverlapRatio(key) {
    const x0 = Math.max(0, key.nx);
    const y0 = Math.max(0, key.ny);
    const x1 = Math.min(1, key.nx + key.nw);
    const y1 = Math.min(1, key.ny + key.nh);
    const iw = x1 - x0;
    const ih = y1 - y0;
    if (iw <= 0 || ih <= 0) return 0;
    const inter = iw * ih;
    const a = key.nw * key.nh;
    return a > 0 ? inter / a : 0;
  }

  /** 動画レイアウト（object-fit: contain）。幅・高さはステージの client 寸法に統一（キャンバスと一致させギャップを防ぐ）。 */
  function videoLayout() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;
    const cw = Math.max(1, stage.clientWidth);
    const ch = Math.max(1, stage.clientHeight);
    const scale = Math.min(cw / vw, ch / vh);
    const rw = vw * scale;
    const rh = vh * scale;
    const ox = (cw - rw) / 2;
    const oy = (ch - rh) / 2;
    return { vw, vh, rw, rh, ox, oy, rectW: cw, rectH: ch };
  }

  function resizeOverlay() {
    overlay.width = Math.max(1, stage.clientWidth);
    overlay.height = Math.max(1, stage.clientHeight);
    renderOverlay();
  }

  /** 画面上のイベント座標をステージ（＝キャンバス論理座標系）へのローカルに変換 */
  function pointerOnStage(clientX, clientY) {
    const sr = stage.getBoundingClientRect();
    return { lx: clientX - sr.left, ly: clientY - sr.top };
  }

  function stageToNormalized(clientX, clientY) {
    const L = videoLayout();
    if (!L) return null;
    const { lx, ly } = pointerOnStage(clientX, clientY);
    if (lx < L.ox || ly < L.oy || lx > L.ox + L.rw || ly > L.oy + L.rh) return null;
    const nx = (lx - L.ox) / L.rw;
    const ny = (ly - L.oy) / L.rh;
    return { nx, ny, L };
  }

  /** 範囲ドラッグ用。映像の外でも端に吸着する */
  function clientToNormalizedClamped(clientX, clientY) {
    const L = videoLayout();
    if (!L) return null;
    const { lx, ly } = pointerOnStage(clientX, clientY);
    const nx = Math.max(0, Math.min(1, (lx - L.ox) / L.rw));
    const ny = Math.max(0, Math.min(1, (ly - L.oy) / L.rh));
    return { nx, ny };
  }

  function rectFromPoints(x0, y0, x1, y1) {
    const nx = Math.min(x0, x1);
    const ny = Math.min(y0, y1);
    return {
      nx,
      ny,
      nw: Math.abs(x1 - x0),
      nh: Math.abs(y1 - y0),
    };
  }

  function normalizedToOverlayRect(key) {
    const L = videoLayout();
    if (!L) return null;
    const x = L.ox + key.nx * L.rw;
    const y = L.oy + key.ny * L.rh;
    const w = key.nw * L.rw;
    const h = key.nh * L.rh;
    return { x, y, w, h };
  }

  function hitTest(px, py) {
    const L = videoLayout();
    if (!L) return null;
    for (let i = keys.length - 1; i >= 0; i--) {
      const r = normalizedToOverlayRect(keys[i]);
      if (!r) continue;
      const hs = Math.max(12, Math.min(r.w, r.h) * 0.12);
      if (!groupMoveKeys && showKeyHandles) {
        const handles = [
          ["nw", r.x, r.y],
          ["ne", r.x + r.w - hs, r.y],
          ["sw", r.x, r.y + r.h - hs],
          ["se", r.x + r.w - hs, r.y + r.h - hs],
        ];
        for (const [name, hx, hy] of handles) {
          if (px >= hx && px <= hx + hs && py >= hy && py <= hy + hs)
            return { type: "resize", index: i, handle: name };
        }
      }
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h)
        return { type: "move", index: i };
    }
    return null;
  }

  function parseHex(rgb) {
    const m = /^#?([a-f\d]{6})$/i.exec(rgb.trim());
    if (!m) return [255, 255, 255];
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("");
  }

  function bindColor(hexInput, rr, gg, bb) {
    function fromHex() {
      const [r, g, b] = parseHex(hexInput.value);
      rr.value = String(r); gg.value = String(g); bb.value = String(b);
    }
    function fromRgb() {
      const r = Math.max(0, Math.min(255, Number(rr.value) || 0));
      const g = Math.max(0, Math.min(255, Number(gg.value) || 0));
      const b = Math.max(0, Math.min(255, Number(bb.value) || 0));
      rr.value = String(r); gg.value = String(g); bb.value = String(b);
      hexInput.value = rgbToHex(r, g, b);
    }
    hexInput.addEventListener("input", fromHex);
    [rr, gg, bb].forEach((el) => el.addEventListener("change", fromRgb));
    fromRgb();
    return { refreshFromRgb: fromRgb };
  }

  bindColor(colWhite, numWr, numWg, numWb);
  bindColor(colBlack, numBr, numBg, numBb);

  function getRefRgb(kind) {
    if (kind === "black")
      return [Number(numBr.value) || 0, Number(numBg.value) || 0, Number(numBb.value) || 0];
    return [
      Number(numWr.value) || 255,
      Number(numWg.value) || 255,
      Number(numWb.value) || 255,
    ];
  }

  rngTh.addEventListener("input", () => {
    lblTh.textContent = rngTh.value;
  });
  lblTh.textContent = rngTh.value;

  const MIDI_PPQ = 480;
  /** MIDI のテンポ（メタ・tick 変換の両方に使用。自動・固定） */
  const AUTO_MIDI_BPM = 120;

  /**
   * 「左端の音（半音）」セレクトに合わせ、中央ド=C4=60 の付近で左端の MIDI 番号を決める。
   * C→60, C#→61, …, B→71。鍵を横に並べた i 番目は base + i（127 で打ち切り）。
   */
  function autoMidiBaseFromStripe() {
    const pc = Math.max(
      0,
      Math.min(11, Math.floor(Number(selStripeStart.value) || 0)),
    );
    return Math.min(127, 60 + pc);
  }

  let midiRecording = false;
  let midiRecT0 = 0;
  /** @type {{ t: number; b0: number; b1: number; b2: number }[]} */
  let midiRecEvents = [];
  /** @type {Map<number, boolean>} */
  let midiRecPrevOn = new Map();

  function clampMidi(n) {
    return Math.max(0, Math.min(127, Math.round(Number(n) || 0)));
  }

  /** 収録対象動画の再生倍率（等速=1、半分の速度=0.5）。MIDI 書き出し時に wall-clock をこれで縮めて通常テンポ相当にする */
  function getMidiRecordingPlaybackFactor() {
    const raw = Number(numRecPlaybackSpeed.value);
    if (!Number.isFinite(raw) || raw <= 0) return 1;
    return Math.max(0.05, Math.min(1, raw));
  }

  /**
   * MIDI 割当・C4 指定で共通。縦に重なる白鍵と黒鍵は同じ段として左から右。
   * 段が離れていれば上の段から。
   * @param {{ nx: number; ny: number; nw: number; nh: number }[]} list
   */
  function sortKeyList(list) {
    const pending = list.slice().sort(
      (a, b) => (a.ny + a.nh / 2) - (b.ny + b.nh / 2),
    );
    const rows = [];
    for (const k of pending) {
      const cy = k.ny + k.nh / 2;
      let best = null;
      let bestDist = Infinity;
      for (const row of rows) {
        const dist = Math.abs(cy - row.cy);
        const limit = Math.max(k.nh, row.span) * 0.8;
        if (dist <= limit && dist < bestDist) {
          best = row;
          bestDist = dist;
        }
      }
      if (!best) {
        rows.push({ cy, span: k.nh, keys: [k] });
      } else {
        best.keys.push(k);
        const n = best.keys.length;
        best.cy = (best.cy * (n - 1) + cy) / n;
        best.span = Math.max(best.span, k.nh);
      }
    }
    rows.sort((a, b) => a.cy - b.cy);
    const out = [];
    for (const row of rows) {
      row.keys.sort((a, b) => (a.nx + a.nw / 2) - (b.nx + b.nw / 2));
      out.push(...row.keys);
    }
    return out;
  }

  function sortKeysSpatially() {
    return sortKeyList(keys);
  }

  /** クリックした鍵を C4 アンカーにし、sortKeysSpatially 順で 60 + (i - j)。低い鍵は 60 未満もそのまま clamp。 */
  function applyC4Anchor(anchorKey) {
    const sorted = sortKeysSpatially();
    const j = sorted.findIndex((k) => k.id === anchorKey.id);
    if (j < 0) return;
    midiC4KeyId = anchorKey.id;
    sorted.forEach((k, i) => {
      k.midiNote = clampMidi(60 + (i - j));
    });
  }

  /**
   * 収録・表示の単一の音源。C4 指定時はその鍵を 60、左が減ら右が増（0–127）。
   * 未指定時は「左端の音」を 0 番目に相当させ spatial 順で base+i。
   */
  function buildMidiNoteMap() {
    const m = new Map();
    if (!keys.length) return m;
    if (midiC4KeyId != null && !keys.some((x) => x.id === midiC4KeyId)) {
      midiC4KeyId = null;
    }
    const sorted = sortKeysSpatially();
    const j =
      midiC4KeyId != null
        ? sorted.findIndex((x) => x.id === midiC4KeyId)
        : -1;
    const base = autoMidiBaseFromStripe();
    sorted.forEach((k, i) => {
      const n = j >= 0 ? 60 + (i - j) : base + i;
      m.set(k.id, clampMidi(n));
    });
    return m;
  }

  /** 収録直前に各 key.midiNote を map と一致させる（JSON 出力とも一致） */
  function syncKeyMidiNotesFromMap() {
    const map = buildMidiNoteMap();
    for (const k of keys) {
      const v = map.get(k.id);
      if (v != null) k.midiNote = v;
    }
  }

  function setPickC4Mode(on) {
    pickC4Mode = on;
    if (on && rangeDrawMode) {
      rangeDrawMode = false;
      rangeDraft = null;
      btnRangeDraw.textContent = "鍵盤範囲を指定: オフ";
    }
    btnPickC4.textContent = on ? "C4指定をやめる" : "C4を指定";
    if (!midiRecording) {
      lblMidiRec.textContent = "";
      lblMidiRec.hidden = true;
    }
    syncOverlayCursorStyle();
  }

  function syncPickC4Button() {
    btnPickC4.disabled = keys.length === 0;
    if (keys.length === 0 && pickC4Mode) setPickC4Mode(false);
  }

  /** 収録開始前に midiNote を最新のマップへそろえる */
  function ensureMidiNotesForRecording() {
    syncKeyMidiNotesFromMap();
  }

  function syncMidiRecButtons() {
    const can = !!video.srcObject && keys.length > 0;
    btnMidiRecStart.disabled = !can || midiRecording;
    btnMidiRecStop.disabled = !midiRecording;
  }

  function abortMidiRecording() {
    if (!midiRecording) return;
    midiRecording = false;
    midiRecEvents = [];
    midiRecPrevOn = new Map();
    lblMidiRec.textContent = "";
    lblMidiRec.hidden = true;
    syncMidiRecButtons();
  }

  function startMidiRecording() {
    if (!video.srcObject || !keys.length) {
      alert("画面共有中で、かつ鍵が1つ以上あるときのみ収録できます。");
      return;
    }
    if (pickC4Mode) setPickC4Mode(false);
    ensureMidiNotesForRecording();
    midiRecording = true;
    midiRecEvents = [];
    midiRecPrevOn = new Map();
    midiRecT0 = performance.now();
    lblMidiRec.textContent = "収録中";
    lblMidiRec.hidden = false;
    syncMidiRecButtons();
  }

  function appendMidiVLQ(bytes, n) {
    let v = n >>> 0;
    const stack = [v & 0x7f];
    v >>= 7;
    while (v > 0) {
      stack.unshift((v & 0x7f) | 0x80);
      v >>= 7;
    }
    for (const b of stack) bytes.push(b);
  }

  function u16be(n) {
    return [(n >> 8) & 0xff, n & 0xff];
  }

  function u32be(n) {
    return [(n >> 24) & 0xff, (n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
  }

  /**
   * @param {{ t: number; b0: number; b1: number; b2: number }[]} absEv 絶対時刻 ms
   */
  function buildMidiType0(absEv, bpm) {
    bpm = Math.max(20, Math.min(300, Number(bpm) || 120));
    const usPerQuarter = Math.round(6e7 / bpm);
    const tr = [];
    tr.push(0);
    tr.push(0xff, 0x51, 0x03, (usPerQuarter >> 16) & 0xff, (usPerQuarter >> 8) & 0xff, usPerQuarter & 0xff);
    const name = "Keyboard Capture";
    const enc = new TextEncoder();
    const nb = enc.encode(name);
    tr.push(0);
    tr.push(0xff, 0x03, nb.length, ...nb);

    const sorted = absEv.slice().sort((a, b) => a.t - b.t || a.b0 - b.b0);
    let prevTick = 0;
    for (const ev of sorted) {
      const tick = Math.round((ev.t / 1000) * (bpm / 60) * MIDI_PPQ);
      const d = Math.max(0, tick - prevTick);
      prevTick = tick;
      appendMidiVLQ(tr, d);
      tr.push(ev.b0 & 0xff, ev.b1 & 0xff, ev.b2 & 0xff);
    }
    tr.push(0);
    tr.push(0xff, 0x2f, 0x00);

    const trackLen = tr.length;
    const header = [];
    header.push(...enc.encode("MThd"), ...u32be(6), ...u16be(0), ...u16be(1), ...u16be(MIDI_PPQ));
    const trackChunk = [...enc.encode("MTrk"), ...u32be(trackLen), ...tr];
    return new Uint8Array([...header, ...trackChunk]);
  }

  function stopMidiRecordingAndExport() {
    if (!midiRecording) return;
    const speedFactor = getMidiRecordingPlaybackFactor();
    const tEndRaw = performance.now() - midiRecT0;
    const stillOn = new Map(midiRecPrevOn);
    const noteMapStop = buildMidiNoteMap();
    for (const k of keys) {
      if (stillOn.get(k.id) === true) {
        const note = noteMapStop.get(k.id) ?? 60;
        midiRecEvents.push({ t: tEndRaw, b0: 0x80, b1: note, b2: 0 });
      }
    }
    const events = midiRecEvents.map((e) => ({
      t: e.t * speedFactor,
      b0: e.b0,
      b1: e.b1,
      b2: e.b2,
    }));
    midiRecEvents = [];
    midiRecording = false;
    midiRecPrevOn = new Map();
    lblMidiRec.textContent = "";
    lblMidiRec.hidden = true;
    syncMidiRecButtons();
    const hasNoteOn = events.some((e) => (e.b0 & 0xf0) === 0x90);
    if (!hasNoteOn) {
      alert("保存する MIDI イベントがありません。");
      return;
    }
    const data = buildMidiType0(events, AUTO_MIDI_BPM);
    const blob = new Blob([data], { type: "audio/midi" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "keyboard_capture.mid";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function processMidiRecordingFrame(thSq) {
    if (!midiRecording) return;
    const t = performance.now() - midiRecT0;
    const noteMap = buildMidiNoteMap();
    for (const k of keys) {
      const d = stateDelta[k.id] ?? 0;
      const on = d * d >= thSq;
      const was = midiRecPrevOn.get(k.id) === true;
      const note = noteMap.get(k.id) ?? 60;
      if (on && !was) {
        midiRecEvents.push({ t, b0: 0x90, b1: note, b2: 100 });
      } else if (!on && was) {
        midiRecEvents.push({ t, b0: 0x80, b1: note, b2: 0 });
      }
      midiRecPrevOn.set(k.id, on);
    }
  }

  /** Web MIDI API の初期化。接続ボタンクリック時に呼ぶ */
  async function initWebMidi() {
    try {
      if (!navigator.requestMIDIAccess) {
        alert("このブラウザは Web MIDI API に対応していません（Chrome / Edge 推奨）。");
        return false;
      }
      midiAccess = await navigator.requestMIDIAccess();
      updateMidiOutputList();
      return true;
    } catch (err) {
      alert("MIDI アクセス許可が取得できませんでした。\n" + (err && err.message ? err.message : ""));
      console.error(err);
      return false;
    }
  }

  /** MIDI 出力デバイスの一覧を取得・更新 */
  function updateMidiOutputList() {
    if (!midiAccess) return;
    midiOutputs = [];
    const outputs = midiAccess.outputs;
    outputs.forEach((output) => {
      midiOutputs.push(output);
    });
    if (midiOutputs.length === 0) {
      currentMidiOutput = null;
      midiStatus.textContent = "MIDI デバイスが見つかりません";
      realtimeMidiEnabled = false;
    } else if (midiOutputs.length === 1) {
      currentMidiOutput = midiOutputs[0];
      midiStatus.textContent = "MIDI: " + (currentMidiOutput.name || "出力");
      realtimeMidiEnabled = true;
      midiRealtimePrevOn.clear();
    } else {
      selectMidiOutputDialog();
    }
  }

  /** 複数の MIDI デバイスがある場合、選択ダイアログを表示 */
  function selectMidiOutputDialog() {
    const names = midiOutputs.map((o, i) => `[${i}] ${o.name || "MIDI Out " + i}`).join("\n");
    const input = prompt(
      "接続する MIDI デバイスを選択してください:\n\n" + names,
      "0"
    );
    if (input === null) {
      currentMidiOutput = null;
      midiStatus.textContent = "接続をキャンセルしました";
      realtimeMidiEnabled = false;
      return;
    }
    const idx = parseInt(input, 10);
    if (idx >= 0 && idx < midiOutputs.length) {
      currentMidiOutput = midiOutputs[idx];
      midiStatus.textContent = "MIDI: " + (currentMidiOutput.name || "出力");
      realtimeMidiEnabled = true;
      midiRealtimePrevOn.clear();
    } else {
      alert("不正な選択です。");
      currentMidiOutput = null;
      midiStatus.textContent = "接続できませんでした";
      realtimeMidiEnabled = false;
    }
  }

  /** MIDI デバイス接続を解除 */
  function disconnectMidiDevice() {
    currentMidiOutput = null;
    realtimeMidiEnabled = false;
    midiRealtimePrevOn.clear();
    midiStatus.textContent = "接続なし";
    btnMidiConnect.textContent = "MIDI 接続";
  }

  /** リアルタイムで MIDI Note On/Off を送信。検出フレーム内で呼ぶ */
  function processMidiRealtimeFrame(thSq) {
    if (!realtimeMidiEnabled || !currentMidiOutput || !keys.length) return;
    const noteMap = buildMidiNoteMap();
    for (const k of keys) {
      const d = stateDelta[k.id] ?? 0;
      const on = d * d >= thSq;
      const was = midiRealtimePrevOn.get(k.id) === true;
      if (on && !was) {
        const note = noteMap.get(k.id) ?? 60;
        try {
          currentMidiOutput.send([0x90, note, 100]);
        } catch (e) {
          console.warn("MIDI Note On 送信失敗:", e);
        }
      } else if (!on && was) {
        const note = noteMap.get(k.id) ?? 60;
        try {
          currentMidiOutput.send([0x80, note, 0]);
        } catch (e) {
          console.warn("MIDI Note Off 送信失敗:", e);
        }
      }
      midiRealtimePrevOn.set(k.id, on);
    }
  }

  const MOTOR_NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  function midiNoteToName(midiNote) {
    const n = Math.round(Number(midiNote) || 0);
    const octave = Math.floor(n / 12) - 1;
    return MOTOR_NOTE_NAMES[((n % 12) + 12) % 12] + octave;
  }

  function updateStatusSerial(type, message) {
    serialStatus.hidden = false;
    serialStatus.className = "serial-status " + (type === "success" ? "ok" : type === "error" ? "err" : "info");
    serialStatus.textContent = message;
  }

  function updateActiveMotorsDisplay() {
    if (activeMotors.size === 0) {
      activeMotorsEl.className = "motor-notes empty";
      activeMotorsEl.textContent = "—";
      return;
    }
    activeMotorsEl.className = "motor-notes";
    activeMotorsEl.innerHTML = "";
    for (const [motorNum, midiNote] of activeMotors) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = midiNoteToName(midiNote) + " (M" + motorNum + ")";
      activeMotorsEl.appendChild(chip);
    }
  }

  async function connectSerial() {
    try {
      if (!navigator.serial) {
        updateStatusSerial("error", "Web Serial API 未サポート（Chrome / Edge 推奨）");
        return;
      }
      serialPort = await navigator.serial.requestPort();
      await serialPort.open({ baudRate: 115200 });
      serialReader = serialPort.readable.getReader();
      serialWriter = serialPort.writable.getWriter();
      motorRealtimeEnabled = true;
      motorRealtimePrevOn.clear();
      keysOnMotors.clear();
      motorKeyOwners.clear();
      motorSerialQueue = Promise.resolve();
      updateStatusSerial("success", "Arduino 接続成功");
      btnArduinoConnect.disabled = true;
      btnArduinoDisconnect.disabled = false;
      btnArduinoReset.disabled = false;
      readSerial();
    } catch (error) {
      console.error("Serial connection error:", error);
      motorRealtimeEnabled = false;
      if (error.message && (error.message.includes("No port selected") || error.name === "NotFoundError")) {
        updateStatusSerial("error", "ポート選択がキャンセルされました。");
      } else {
        updateStatusSerial("error", "Arduino 接続失敗: " + error.message);
      }
    }
  }

  async function disconnectSerial() {
    try {
      motorRealtimeEnabled = false;
      motorRealtimePrevOn.clear();
      if (serialReader) {
        try { await serialReader.cancel(); } catch (_) { /* ignore */ }
        serialReader = null;
      }
      if (serialWriter) {
        try { await serialWriter.releaseLock(); } catch (_) { /* ignore */ }
        serialWriter = null;
      }
      if (serialPort) {
        await serialPort.close();
        serialPort = null;
      }
      activeMotors.clear();
      notesOnMotors.clear();
      keysOnMotors.clear();
      motorKeyOwners.clear();
      motorSerialQueue = Promise.resolve();
      updateActiveMotorsDisplay();
      updateStatusSerial("info", "Arduino 切断");
      btnArduinoConnect.disabled = false;
      btnArduinoDisconnect.disabled = true;
      btnArduinoReset.disabled = true;
    } catch (error) {
      console.error("Serial disconnect error:", error);
    }
  }

  async function readSerial() {
    if (!serialReader) return;
    try {
      while (true) {
        const { value, done } = await serialReader.read();
        if (done) break;
        console.log("Received from Arduino:", value);
      }
    } catch (error) {
      console.error("Serial read error:", error);
    }
  }

  function enqueueMotorTask(task) {
    motorSerialQueue = motorSerialQueue
      .then(() => task())
      .catch((err) => {
        console.error("Motor serial queue error:", err);
      });
  }

  function clearMotorKeyMapping(motorNum) {
    const keyId = motorKeyOwners.get(motorNum);
    motorKeyOwners.delete(motorNum);
    if (keyId !== undefined) keysOnMotors.delete(keyId);
  }

  async function sendStopNote(motorNum) {
    if (!serialWriter || !serialPort) return;

    try {
      const msg = new Uint8Array([0x80, motorNum]);
      await serialWriter.write(msg);
      const note = activeMotors.get(motorNum);
      activeMotors.delete(motorNum);
      if (note !== undefined) notesOnMotors.delete(note);
      clearMotorKeyMapping(motorNum);
      updateActiveMotorsDisplay();
    } catch (error) {
      console.error("Send stop note error:", error);
    }
  }

  async function motorNoteOnForKey(keyId, midiNote) {
    if (!serialWriter || !serialPort) return;
    if (motorRealtimePrevOn.get(keyId) !== true) return;
    if (keysOnMotors.has(keyId)) return;

    if (notesOnMotors.has(midiNote)) {
      await sendStopNote(notesOnMotors.get(midiNote));
    }
    if (motorRealtimePrevOn.get(keyId) !== true) return;

    let motorNum = -1;
    for (let m = 0; m < 2; m++) {
      if (!activeMotors.has(m)) {
        motorNum = m;
        break;
      }
    }

    if (motorNum === -1) {
      if (!chkPolyPhony.checked) {
        let lowestNote = 127;
        let lowestMotor = -1;
        for (const [note, motor] of notesOnMotors) {
          if (note < lowestNote) {
            lowestNote = note;
            lowestMotor = motor;
          }
        }
        if (lowestMotor !== -1) {
          await sendStopNote(lowestMotor);
          motorNum = lowestMotor;
        }
      } else {
        return;
      }
    }
    if (motorNum === -1 || motorRealtimePrevOn.get(keyId) !== true) return;

    try {
      const msg = new Uint8Array([0x90, midiNote]);
      await serialWriter.write(msg);
      activeMotors.set(motorNum, midiNote);
      notesOnMotors.set(midiNote, motorNum);
      keysOnMotors.set(keyId, motorNum);
      motorKeyOwners.set(motorNum, keyId);
      updateActiveMotorsDisplay();
    } catch (error) {
      console.error("Send noteOn error:", error);
    }
  }

  async function motorNoteOffForKey(keyId) {
    const motorNum = keysOnMotors.get(keyId);
    if (motorNum === undefined) return;
    await sendStopNote(motorNum);
  }

  async function resetArduino() {
    if (!serialWriter || !serialPort) return;
    try {
      const msg = new Uint8Array([0xff]);
      await serialWriter.write(msg);
      activeMotors.clear();
      notesOnMotors.clear();
      keysOnMotors.clear();
      motorKeyOwners.clear();
      motorRealtimePrevOn.clear();
      motorSerialQueue = Promise.resolve();
      updateActiveMotorsDisplay();
      updateStatusSerial("success", "リセット完了");
    } catch (error) {
      console.error("Reset error:", error);
    }
  }

  /** リアルタイムで検出結果を Arduino モーターへ送信 */
  function processMotorRealtimeFrame(thSq) {
    if (!motorRealtimeEnabled || !serialWriter || !serialPort || !keys.length) return;
    const noteMap = buildMidiNoteMap();
    for (const k of keys) {
      const d = stateDelta[k.id] ?? 0;
      const on = d * d >= thSq;
      const was = motorRealtimePrevOn.get(k.id) === true;
      const note = noteMap.get(k.id) ?? 60;
      if (on && !was) {
        motorRealtimePrevOn.set(k.id, true);
        enqueueMotorTask(() => motorNoteOnForKey(k.id, note));
      } else if (!on && was) {
        motorRealtimePrevOn.set(k.id, false);
        enqueueMotorTask(() => motorNoteOffForKey(k.id));
      }
    }
    // 取りこぼし: 検出 OFF なのにモーター割当が残っている鍵を強制停止
    for (const k of keys) {
      const d = stateDelta[k.id] ?? 0;
      const on = d * d >= thSq;
      if (!on && keysOnMotors.has(k.id)) {
        motorRealtimePrevOn.set(k.id, false);
        enqueueMotorTask(() => motorNoteOffForKey(k.id));
      }
    }
  }

  /** 色差（平方距離。※√は閾値と比較するキー数が多いときに省略可能） */
  function rgbDistanceSq(a, b) {
    const dr = a[0] - b[0];
    const dg = a[1] - b[1];
    const db = a[2] - b[2];
    return dr * dr + dg * dg + db * db;
  }

  /**
   * 鍵間の隙間／縁を避けるため、矩形の幾何中心を維持しつつ周囲を除いた領域を動画ピクセルへ。
   * 色差判定・標準色サンプルのみこれを使う。
   */
  function keySamplingVideoRect(key) {
    if (keyVideoOverlapRatio(key) < 0.15) return null;
    const L = videoLayout();
    if (!L) return null;
    const vw = L.vw, vh = L.vh;
    const gapXKey = key.kind === "black" ? 0.14 : 0.18;
    const gapYKey = key.kind === "black" ? 0.12 : 0.10;
    let innerW = key.nw * (1 - 2 * gapXKey);
    let innerH = key.nh * (1 - 2 * gapYKey);
    innerW = Math.max(innerW, key.nw * 0.22, 4 / vw);
    innerH = Math.max(innerH, key.nh * 0.26, 4 / vh);
    innerW = Math.min(innerW, key.nw);
    innerH = Math.min(innerH, key.nh);
    const cx = key.nx + key.nw / 2;
    const cy = key.ny + key.nh / 2;
    let snx = cx - innerW / 2;
    let sny = cy - innerH / 2;
    snx = Math.max(key.nx, Math.min(key.nx + key.nw - innerW, snx));
    sny = Math.max(key.ny, Math.min(key.ny + key.nh - innerH, sny));
    snx = Math.max(0, Math.min(1 - innerW, snx));
    sny = Math.max(0, Math.min(1 - innerH, sny));
    let vx0 = Math.floor(snx * vw);
    let vy0 = Math.floor(sny * vh);
    let vx1 = Math.ceil((snx + innerW) * vw);
    let vy1 = Math.ceil((sny + innerH) * vh);
    vx0 = Math.max(0, Math.min(vw - 1, vx0));
    vy0 = Math.max(0, Math.min(vh - 1, vy0));
    vx1 = Math.max(vx0 + 1, Math.min(vw, vx1));
    vy1 = Math.max(vy0 + 1, Math.min(vh, vy1));
    return { vx0, vy0, vw: vx1 - vx0, vh: vy1 - vy0 };
  }

  /**
   * sampleCv に描画済みの矩形から平均 RGB。
   * 各ピクセルごとに getImageData していたボトルネックを、1 回の getImageData で解消。
   */
  function avgRgbOfVideoRect(vRect) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh || !video.srcObject) return null;
    let { vx0, vy0, vw: rw, vh: rh } = vRect;
    vx0 = Math.max(0, Math.min(vw - 1, vx0));
    vy0 = Math.max(0, Math.min(vh - 1, vy0));
    rw = Math.max(1, Math.min(rw, vw - vx0));
    rh = Math.max(1, Math.min(rh, vh - vy0));
    const img = sctx.getImageData(vx0, vy0, rw, rh);
    const data = img.data;
    const stepX = Math.max(1, Math.floor(rw / 24));
    const stepY = Math.max(1, Math.floor(rh / 24));
    let r = 0, g = 0, b = 0, n = 0;
    for (let iy = 0; iy < rh; iy += stepY) {
      const y = Math.min(rh - 1, iy);
      const rowOfs = y * rw * 4;
      for (let ix = 0; ix < rw; ix += stepX) {
        const x = Math.min(rw - 1, ix);
        const i = rowOfs + x * 4;
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        n++;
      }
    }
    if (!n) return null;
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  }

  function sampleKindDefaultsFromFrame() {
    const sums = {
      white: { r: 0, g: 0, b: 0, n: 0 },
      black: { r: 0, g: 0, b: 0, n: 0 },
    };
    if (!captureVideoFrameBitmap()) {
      alert("画面共有中のときのみ使えます。");
      return;
    }
    for (const k of keys) {
      const vr = keySamplingVideoRect(k);
      if (!vr) continue;
      const avg = avgRgbOfVideoRect(vr);
      if (!avg) continue;
      const s = sums[k.kind];
      s.r += avg[0]; s.g += avg[1]; s.b += avg[2]; s.n++;
    }
    const apply = (hexInput, rr, gg, bb, agg) => {
      if (!agg || agg.n < 1) return;
      const r = Math.round(agg.r / agg.n), g = Math.round(agg.g / agg.n), b = Math.round(agg.b / agg.n);
      rr.value = String(r); gg.value = String(g); bb.value = String(b);
      hexInput.value = rgbToHex(r, g, b);
    };
    apply(colWhite, numWr, numWg, numWb, sums.white.n ? sums.white : null);
    apply(colBlack, numBr, numBg, numBb, sums.black.n ? sums.black : null);
  }

  btnSampleDefaults.addEventListener("click", () => {
    sampleKindDefaultsFromFrame();
  });

  const stateDelta = {};
  let lastKeySignature = "";

  function getKeySignature() {
    if (!keys.length) return "";
    return keys
      .map((k) => k.id)
      .sort((a, b) => a - b)
      .join(",");
  }

  /** 検出対象があるフレームは video を一度だけ転送し、矩形サンプルをまとめる */
  function captureVideoFrameBitmap() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh || !video.srcObject) return false;
    if (sampleCv.width !== vw || sampleCv.height !== vh) {
      sampleCv.width = vw;
      sampleCv.height = vh;
    }
    sctx.drawImage(video, 0, 0, vw, vh);
    return true;
  }

  function measureKeys() {
    const th = Number(rngTh.value) || 28;
    if (!keys.length) {
      if (midiRecording) abortMidiRecording();
      renderOverlay();
      return;
    }
    if (!captureVideoFrameBitmap()) return;
    const thSq = th * th;
    for (const k of keys) stateDelta[k.id] = 0;

    keys.forEach((k) => {
      const vr = keySamplingVideoRect(k);
      const ref = getRefRgb(k.kind);
      if (!vr) return;
      const avg = avgRgbOfVideoRect(vr);
      if (!avg) return;
      const dSq = rgbDistanceSq(avg, ref);
      stateDelta[k.id] = Math.sqrt(dSq);
    });
    const sig = getKeySignature();
    if (sig !== lastKeySignature) {
      rebuildTable(th);
    } else {
      updateTableCells(th, thSq);
    }
    processMidiRecordingFrame(thSq);
    processMidiRealtimeFrame(thSq);
    processMotorRealtimeFrame(thSq);
    renderOverlay();
  }

  /** 行構成が変わらないとき DOM を作り直さず数値と ON/OFF だけ更新 */
  function updateTableCells(th, thSq) {
    const sorted = keys.slice().sort((a, b) => a.id - b.id);
    if (keyRows.children.length !== sorted.length) {
      rebuildTable(th);
      return;
    }
    for (let i = 0; i < sorted.length; i++) {
      const k = sorted[i];
      const tr = keyRows.children[i];
      const d = stateDelta[k.id] ?? 0;
      const on = d * d >= thSq;
      tr.className = on ? "active" : "inactive";
      const dot = tr.querySelector(".status-dot");
      if (dot) dot.className = "status-dot " + (on ? "on" : "off");
      const tdDelta = tr.querySelector(".delta");
      if (tdDelta) tdDelta.textContent = d.toFixed(1);
    }
  }

  function rebuildTable(th) {
    keyRows.innerHTML = "";
    keys
      .slice()
      .sort((a, b) => a.id - b.id)
      .forEach((k) => {
        const d = stateDelta[k.id] ?? 0;
        const on = d >= th;
        const tr = document.createElement("tr");
        tr.className = on ? "active" : "inactive";
        tr.innerHTML = `
          <td><span class="status-dot ${on ? "on" : "off"}"></span>#${k.id}</td>
          <td>${k.kind === "white" ? "白鍵" : "黒鍵"}</td>
          <td class="delta">${d.toFixed(1)}</td>
          <td><button type="button" data-del="${k.id}">削除</button></td>
        `;
        tr.querySelector("button[data-del]").addEventListener("click", () => {
          const delId = k.id;
          if (midiC4KeyId === delId) midiC4KeyId = null;
          keys = keys.filter((x) => x.id !== delId);
          rebuildTable(Number(rngTh.value) || 28);
          renderOverlay();
        });
        keyRows.appendChild(tr);
      });
    lastKeySignature = getKeySignature();
  }

  function renderOverlay() {
    const L = videoLayout();
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (!L) return;
    const th = Number(rngTh.value) || 28;
    const noteMap = buildMidiNoteMap();

    keys.forEach((k, ix) => {
      const r = normalizedToOverlayRect(k);
      if (!r || r.w < 2 || r.h < 2) return;
      const d = stateDelta[k.id] ?? 0;
      const pressed = d >= th;
      const isWhiteKind = k.kind === "white";
      const isC4Anchor = midiC4KeyId != null && k.id === midiC4KeyId;
      let strokeMain = isWhiteKind
        ? (pressed ? "rgba(255,215,132,1)" : "rgba(255,200,106,0.95)")
        : (pressed ? "rgba(205,164,255,1)" : "rgba(170,118,255,0.95)");
      let fillBase = pressed
        ? (isWhiteKind ? "rgba(255,236,188,0.18)" : "rgba(146,106,218,0.22)")
        : (isWhiteKind ? "rgba(255,226,166,0.12)" : "rgba(120,74,210,0.16)");
      if (isC4Anchor) {
        strokeMain = pressed
          ? "rgba(90,255,245,1)"
          : "rgba(40,220,255,0.98)";
        fillBase = pressed
          ? "rgba(64,240,255,0.26)"
          : "rgba(32,180,220,0.2)";
      }

      octx.strokeStyle = strokeMain;
      octx.lineWidth = isC4Anchor ? 3.2 : pressed ? 3 : activeIndex === ix ? 3 : isWhiteKind ? 2.2 : 2.4;
      octx.fillStyle = fillBase;
      octx.fillRect(r.x, r.y, r.w, r.h);

      octx.strokeStyle = strokeMain;
      octx.strokeRect(r.x + 0.5, r.y + 0.5, Math.max(0, r.w - 1), Math.max(0, r.h - 1));

      /* 検出オンは種類ごとの枠色を維持し、鍵の内側左にミントの条だけ（枠線を緑にしないと白黒が判別しやすい） */
      if (pressed && !isC4Anchor) {
        const bwBar = Math.max(4, Math.min(r.w * 0.26, 9));
        const padY = Math.min(r.h * 0.14, 7);
        octx.fillStyle = "rgba(90,236,172,0.92)";
        octx.fillRect(
          r.x + 5,
          r.y + padY,
          bwBar,
          Math.max(4, r.h - padY * 2),
        );
      }
      if (pressed && isC4Anchor) {
        const bwBar = Math.max(4, Math.min(r.w * 0.26, 9));
        const padY = Math.min(r.h * 0.14, 7);
        octx.fillStyle = "rgba(255,255,255,0.82)";
        octx.fillRect(
          r.x + 5,
          r.y + padY,
          bwBar,
          Math.max(4, r.h - padY * 2),
        );
      }

      octx.font = "12px system-ui,Segoe UI,sans-serif";
      const midiN = noteMap.get(k.id);
      const label = `#${k.id}${
        midiN != null ? " m" + midiN : ""
      }${isC4Anchor ? " C4" : ""}${pressed ? " ON" : ""}`;
      octx.fillStyle = pressed
        ? (isWhiteKind ? "#2a5a32" : "#d4fff0")
        : (isWhiteKind ? "#ffe9b8" : "#e4d4ff");
      if (isC4Anchor) {
        octx.fillStyle = pressed ? "#063a3d" : "#b8f8ff";
      }
      octx.fillText(label, r.x + 4, r.y + Math.min(r.h - 6, 16));

      /* グループ移動モードでは角だけ誤ドラッグを避けるため非表示にするが、並進ドラッグ中は点線で掴んだ鍵のみ示す（下へ） */
      if (
        dragKind !== "moveGroup" &&
        (showKeyHandles || dragKind !== null || activeIndex === ix)
      ) {
        const hs = Math.max(12, Math.min(r.w, r.h) * 0.12);
        octx.strokeStyle = k.kind === "white"
          ? "rgba(255,206,132,0.85)"
          : "rgba(200,154,255,0.88)";
        octx.lineWidth = 1;
        ["nw","ne","se","sw"].forEach((h) => {
          let hx = r.x, hy = r.y;
          if (h.includes("e")) hx = r.x + r.w - hs;
          if (h.includes("s")) hy = r.y + r.h - hs;
          octx.strokeRect(hx + 0.5, hy + 0.5, hs - 1, hs - 1);
        });
      }

      /* グループ移動ドラッグ中は操作した鍵を軽く示す（角ハンドルは出さない） */
      if (dragKind === "moveGroup" && activeIndex === ix) {
        octx.setLineDash([5, 4]);
        octx.strokeStyle = "rgba(230,246,255,0.75)";
        octx.lineWidth = 1.4;
        octx.strokeRect(
          r.x - 2 + 0.5,
          r.y - 2 + 0.5,
          Math.max(0, r.w + 3),
          Math.max(0, r.h + 3),
        );
        octx.setLineDash([]);
      }
    });

    if (rangeDraft && rangeDraft.nw > 0.002 && rangeDraft.nh > 0.002) {
      const r = normalizedToOverlayRect(rangeDraft);
      if (r) {
        octx.save();
        octx.setLineDash([7, 5]);
        octx.strokeStyle = "rgba(80, 230, 255, 0.95)";
        octx.lineWidth = 2;
        octx.fillStyle = "rgba(80, 230, 255, 0.12)";
        octx.fillRect(r.x, r.y, r.w, r.h);
        octx.strokeRect(r.x + 0.5, r.y + 0.5, Math.max(0, r.w - 1), Math.max(0, r.h - 1));
        octx.setLineDash([]);
        octx.font = "12px system-ui,Segoe UI,sans-serif";
        octx.fillStyle = "#d9fbff";
        octx.fillText("鍵盤範囲", r.x + 6, Math.min(r.y + r.h - 6, r.y + 16));
        octx.restore();
      }
    }
  }

  function pushKeyNormalized(nx, ny, nw, nh, kind) {
    nw = Math.max(0.001, Math.min(1 - nx, nw));
    nh = Math.max(0.001, Math.min(1 - ny, nh));
    keys.push({ nx, ny, nw, nh, kind, id: nextId++ });
  }

  function percentile(values, p) {
    const a = Array.from(values).sort((x, y) => x - y);
    if (!a.length) return 0;
    const i = (a.length - 1) * (p / 100);
    const lo = Math.floor(i);
    const hi = Math.min(a.length - 1, lo + 1);
    const t = i - lo;
    return a[lo] * (1 - t) + a[hi] * t;
  }

  function medianNum(values) {
    const a = Array.from(values).sort((x, y) => x - y);
    if (!a.length) return 0;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function smoothArray(src, rad) {
    const n = src.length;
    const out = new Float32Array(n);
    const r = Math.max(0, rad | 0);
    const ps = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) ps[i + 1] = ps[i] + src[i];
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - r);
      const b = Math.min(n - 1, i + r);
      out[i] = (ps[b + 1] - ps[a]) / (b - a + 1);
    }
    return out;
  }

  function otsuFloat(values) {
    let min = Infinity;
    let max = -Infinity;
    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      if (v < min) min = v;
      if (v > max) max = v;
    }
    if (!(max > min)) return min;
    const hist = new Float64Array(256);
    const scale = 255 / (max - min);
    for (let i = 0; i < values.length; i++) {
      const b = Math.max(0, Math.min(255, Math.round((values[i] - min) * scale)));
      hist[b]++;
    }
    const total = values.length;
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0;
    let wB = 0;
    let best = -1;
    let threshold = 128;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (!wB) continue;
      const wF = total - wB;
      if (!wF) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > best) {
        best = between;
        threshold = t;
      }
    }
    return min + threshold / scale;
  }

  function maskRuns(mask) {
    const runs = [];
    let s = -1;
    for (let x = 0; x <= mask.length; x++) {
      const on = x < mask.length && mask[x];
      if (on && s < 0) s = x;
      if (!on && s >= 0) {
        runs.push([s, x]);
        s = -1;
      }
    }
    return runs;
  }

  function mergeCloseRuns(runs, gapMax) {
    if (!runs.length) return [];
    const out = [[runs[0][0], runs[0][1]]];
    for (let i = 1; i < runs.length; i++) {
      const prev = out[out.length - 1];
      if (runs[i][0] - prev[1] <= gapMax) prev[1] = runs[i][1];
      else out.push([runs[i][0], runs[i][1]]);
    }
    return out;
  }

  function columnMean(luma, w, h, y0, y1) {
    const a = Math.max(0, Math.min(h - 1, Math.floor(y0)));
    const b = Math.max(a + 1, Math.min(h, Math.ceil(y1)));
    const out = new Float32Array(w);
    const rows = b - a;
    for (let y = a; y < b; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) out[x] += luma[row + x];
    }
    for (let x = 0; x < w; x++) out[x] /= rows;
    return out;
  }

  function lumaFromImage(img) {
    const w = img.width;
    const h = img.height;
    const luma = new Float32Array(w * h);
    const d = img.data;
    for (let p = 0, i = 0; p < luma.length; p++, i += 4) {
      luma[p] = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722;
    }
    return { w, h, luma };
  }

  /** 細い暗線だけを白鍵の隙間として残す。幅の広い暗い帯（押鍵など）は捨てる */
  function selectGapRuns(darkRuns) {
    if (!darkRuns.length) return [];
    const widths = darkRuns.map(([a, b]) => b - a).sort((a, b) => a - b);
    const med = widths[widths.length >> 1];
    const maxW = Math.max(med * 3, 2);
    return darkRuns.filter(([a, b]) => (b - a) <= maxW);
  }

  function segmentsFromGaps(width, gaps) {
    const cuts = [0];
    for (const [a, b] of gaps) cuts.push((a + b) / 2);
    cuts.push(width);
    const segs = [];
    for (let i = 0; i < cuts.length - 1; i++) {
      const s = cuts[i];
      const e = cuts[i + 1];
      if (e - s >= 2) segs.push([s, e]);
    }
    return segs;
  }

  function dropThinSegments(segs) {
    if (segs.length < 2) return segs;
    const med = medianNum(segs.map((s) => s[1] - s[0]));
    return segs.filter((s) => (s[1] - s[0]) >= med * 0.45);
  }

  function segmentsUniform(segs) {
    if (!segs || segs.length < 3) return false;
    const widths = segs.map((s) => s[1] - s[0]);
    const m = medianNum(widths);
    if (m <= 0) return false;
    let acc = 0;
    for (const w of widths) acc += Math.abs(w - m);
    return acc / widths.length / m < 0.28;
  }

  function findWhiteByGaps(profile) {
    const p70 = percentile(profile, 70);
    const p10 = percentile(profile, 10);
    const gapCut = p70 - Math.max(16, (p70 - p10) * 0.35);
    const dark = new Uint8Array(profile.length);
    for (let x = 0; x < profile.length; x++) {
      if (profile[x] < gapCut) dark[x] = 1;
    }
    const gaps = selectGapRuns(maskRuns(dark));
    if (gaps.length < 2) return null;
    return dropThinSegments(segmentsFromGaps(profile.length, gaps));
  }

  function estimateWhiteWidth(blacks, imgW) {
    if (blacks.length >= 2) {
      const centers = blacks.map((b) => (b[0] + b[1]) / 2).sort((a, b) => a - b);
      const diffs = [];
      for (let i = 1; i < centers.length; i++) diffs.push(centers[i] - centers[i - 1]);
      diffs.sort((a, b) => a - b);
      const half = diffs.slice(0, Math.ceil(diffs.length / 2));
      const medSmall = medianNum(half);
      const medAll = medianNum(diffs);
      const wEst = medAll > medSmall * 1.45 ? medSmall : medAll;
      if (wEst >= 4 && wEst <= imgW * 0.8 && imgW / wEst <= 80) return wEst;
      return null;
    }
    if (blacks.length === 1) {
      const bw = blacks[0][1] - blacks[0][0];
      const wEst = bw / 0.58;
      if (wEst >= 4 && wEst <= imgW * 0.8 && imgW / wEst <= 80) return wEst;
    }
    return null;
  }

  /** 白鍵中心が上側の帯で明るくなる位相を選ぶ */
  function bestWhitePhase(W, upperProfile, imgW) {
    const step = Math.max(1, Math.round(W / 24));
    let bestP = 0;
    let bestScore = -Infinity;
    for (let p = 0; p < W; p += step) {
      let score = 0;
      let n = 0;
      for (let x = p + W * 0.5; x < imgW; x += W) {
        const i = Math.max(0, Math.min(upperProfile.length - 1, Math.round(x)));
        score += upperProfile[i];
        n++;
      }
      if (n && score / n > bestScore) {
        bestScore = score / n;
        bestP = p;
      }
    }
    return bestP;
  }

  function whitesFromBlackGrid(blacks, upperProfile, imgW) {
    const W = estimateWhiteWidth(blacks, imgW);
    if (!W) return null;
    const phase = bestWhitePhase(W, upperProfile, imgW);
    const segs = [];
    for (let i = -1; i < imgW / W + 2; i++) {
      const a = phase + i * W;
      const b = a + W;
      const c0 = Math.max(0, a);
      const c1 = Math.min(imgW, b);
      if (c1 - c0 >= W * 0.45) segs.push([c0, c1]);
    }
    return segs.length >= 3 ? segs : null;
  }

  function chooseWhiteSegments(gapSegs, gridSegs) {
    const gapOk = segmentsUniform(gapSegs);
    const gridOk = gridSegs && gridSegs.length >= 3;
    if (gapOk && gridOk) {
      const rel = Math.abs(gapSegs.length - gridSegs.length) / gridSegs.length;
      return rel <= 0.25 ? gapSegs : gridSegs;
    }
    if (gapOk) return gapSegs;
    if (gridOk) return gridSegs;
    if (gapSegs && gapSegs.length >= 3) return gapSegs;
    return null;
  }

  function blackHeightRatio(luma, w, h, x0, x1) {
    const xa = Math.max(0, Math.floor(x0 + (x1 - x0) * 0.25));
    const xb = Math.min(w, Math.ceil(x0 + (x1 - x0) * 0.75));
    const span = Math.max(1, xb - xa);
    const rows = new Float32Array(h);
    for (let y = 0; y < h; y++) {
      let s = 0;
      const row = y * w;
      for (let x = xa; x < xb; x++) s += luma[row + x];
      rows[y] = s / span;
    }
    const topN = Math.max(1, Math.floor(h * 0.2));
    const botN = Math.max(1, Math.floor(h * 0.78));
    const top = medianNum(rows.subarray(0, topN));
    const bot = medianNum(rows.subarray(botN));
    if (bot - top < 15) return 0.62;
    const mid = (top + bot) / 2;
    let end = Math.floor(h * 0.5);
    let seenDark = false;
    for (let y = 0; y < h * 0.92; y++) {
      if (rows[y] < mid) {
        seenDark = true;
        end = y;
      } else if (seenDark && y > h * 0.25) {
        let bright = 0;
        for (let k = 0; k < 3 && y + k < h; k++) {
          if (rows[y + k] >= mid) bright++;
        }
        if (bright >= 3) break;
      }
    }
    return Math.max(0.4, Math.min(0.8, (end + 1) / h));
  }

  function findBlackRuns(delta) {
    const p90 = percentile(delta, 90);
    const p40 = percentile(delta, 40);
    const spread = p90 - p40;
    const fracCut = p40 + spread * 0.42;
    let n = 0;
    for (let i = 0; i < delta.length; i++) if (delta[i] >= fracCut) n++;
    const frac = n / delta.length;
    const realistic = spread >= 14 && frac >= 0.06 && frac <= 0.72;
    if (!realistic) return { realistic: false, runs: [] };
    const mask = new Uint8Array(delta.length);
    for (let i = 0; i < delta.length; i++) {
      if (delta[i] >= fracCut) mask[i] = 1;
    }
    const minRun = Math.max(2, Math.round(delta.length / 200));
    const fillGap = Math.max(2, Math.round(delta.length / 200));
    let runs = maskRuns(mask).filter(([a, b]) => b - a >= minRun);
    runs = mergeCloseRuns(runs, fillGap);
    return { realistic: true, runs };
  }

  function filterBlackRuns(runs, whiteWidth) {
    if (!runs.length) return [];
    const widths = runs.map(([a, b]) => b - a);
    const med = medianNum(widths);
    return runs.filter(([a, b]) => {
      const bw = b - a;
      if (whiteWidth) return bw >= whiteWidth * 0.22 && bw <= whiteWidth * 1.05;
      return bw >= med * 0.45 && bw <= med * 2.2;
    });
  }

  function absorbTinyClassRuns(runs) {
    if (runs.length < 3) return runs;
    const med = medianNum(runs.map((r) => r.b - r.a));
    const minW = med * 0.4;
    const out = [];
    for (const r of runs) {
      if ((r.b - r.a) < minW && out.length) out[out.length - 1].b = r.b;
      else out.push({ a: r.a, b: r.b, kind: r.kind });
    }
    const merged = [];
    for (const r of out) {
      const prev = merged[merged.length - 1];
      if (prev && prev.kind === r.kind) prev.b = r.b;
      else merged.push({ a: r.a, b: r.b, kind: r.kind });
    }
    return merged.filter((r) => (r.b - r.a) >= minW * 0.5);
  }

  /** 平坦な半音列では E-F と B-C が同じ白のまま隣り合う。黒鍵幅の整数倍なら分割する */
  function splitWideWhiteRuns(runs) {
    const blacks = runs.filter((r) => r.kind === "black");
    if (!blacks.length) return runs;
    const bw = medianNum(blacks.map((r) => r.b - r.a));
    if (!(bw > 1)) return runs;
    const out = [];
    for (const r of runs) {
      if (r.kind === "black") {
        out.push(r);
        continue;
      }
      const w = r.b - r.a;
      const n = Math.max(1, Math.round(w / bw));
      if (n >= 2 && Math.abs(w - n * bw) <= bw * 0.35) {
        const step = w / n;
        for (let i = 0; i < n; i++) {
          out.push({ a: r.a + i * step, b: r.a + (i + 1) * step, kind: "white" });
        }
      } else {
        out.push(r);
      }
    }
    return out;
  }

  function segmentFlatKeys(profile) {
    const hi = percentile(profile, 80);
    const lo = percentile(profile, 20);
    if (hi - lo < 20) return null;
    const cut = otsuFloat(profile);
    const runs = [];
    let s = 0;
    let black = profile[0] < cut;
    for (let x = 1; x <= profile.length; x++) {
      const isBlack = x < profile.length && profile[x] < cut;
      if (x === profile.length || isBlack !== black) {
        runs.push({ a: s, b: x, kind: black ? "black" : "white" });
        s = x;
        black = isBlack;
      }
    }
    const cleaned = splitWideWhiteRuns(absorbTinyClassRuns(runs));
    if (cleaned.length < 3) return null;
    return cleaned;
  }

  function mapPixelSeg(seg, rect, imgW, imgH, kind, y0, y1) {
    return {
      nx: rect.nx + (seg[0] / imgW) * rect.nw,
      nw: ((seg[1] - seg[0]) / imgW) * rect.nw,
      ny: rect.ny + (y0 / imgH) * rect.nh,
      nh: ((y1 - y0) / imgH) * rect.nh,
      kind,
    };
  }

  const PIANO_DETECT_FAIL =
    "白鍵と黒鍵の境界を読み取れませんでした。黒鍵の上端から白鍵の下端まで、鍵盤全体を囲むように置き直してください。";

  /** 黒鍵はド#・レ# の2個と、ファ#・ソ#・ラ# の3個が交互に並ぶ。C# からの白鍵幅単位 */
  const BLACK_SLOT_POS = [0, 1, 3, 4, 5];

  function isBlackPitch(pc) {
    const m = ((pc % 12) + 12) % 12;
    return m === 1 || m === 3 || m === 6 || m === 8 || m === 10;
  }

  function sampleProfile(profile, x) {
    const i = Math.max(0, Math.min(profile.length - 1, Math.round(x)));
    return profile[i];
  }

  function segMeanProfile(profile, a, b) {
    const i0 = Math.max(0, Math.floor(a));
    const i1 = Math.min(profile.length, Math.ceil(b));
    if (i1 <= i0) return 0;
    let s = 0;
    for (let i = i0; i < i1; i++) s += profile[i];
    return s / (i1 - i0);
  }

  function predictBlackCenters(origin, W, imgW) {
    const xs = [];
    if (!(W > 1)) return xs;
    const minX = -0.25 * W;
    const maxX = imgW + 0.25 * W;
    const span = 7 * W;
    const last = Math.ceil((maxX - origin) / span) + 1;
    for (let oct = Math.floor((minX - origin) / span) - 1; oct <= last; oct++) {
      for (let s = 0; s < BLACK_SLOT_POS.length; s++) {
        const x = origin + (oct * 7 + BLACK_SLOT_POS[s]) * W;
        if (x >= minX && x <= maxX) xs.push(x);
      }
    }
    return xs;
  }

  function whiteShiftForBlacks(W, upper, blackCenters, fine) {
    const steps = fine ? Math.max(16, Math.round(W)) : 10;
    let bestS = 0;
    let bestScore = -Infinity;
    for (let k = 0; k < steps; k++) {
      const s = (W * k) / steps;
      let bright = 0;
      let n = 0;
      for (let x = s + W * 0.5; x < upper.length; x += W) {
        bright += sampleProfile(upper, x);
        n++;
      }
      let penalty = 0;
      for (let i = 0; i < blackCenters.length; i++) {
        const rel = ((blackCenters[i] - s) % W + W) % W;
        if (Math.abs(rel - W * 0.5) < W * 0.2) penalty += 50;
      }
      const score = (n ? bright / n : 0) - penalty;
      if (score > bestScore) {
        bestScore = score;
        bestS = s;
      }
    }
    if (!fine) return bestS;
    const rad = Math.max(1, W / steps);
    for (let s = bestS - rad; s <= bestS + rad; s += 1) {
      const shift = ((s % W) + W) % W;
      let bright = 0;
      let n = 0;
      for (let x = shift + W * 0.5; x < upper.length; x += W) {
        bright += sampleProfile(upper, x);
        n++;
      }
      let penalty = 0;
      for (let i = 0; i < blackCenters.length; i++) {
        const rel = ((blackCenters[i] - shift) % W + W) % W;
        if (Math.abs(rel - W * 0.5) < W * 0.2) penalty += 50;
      }
      const score = (n ? bright / n : 0) - penalty;
      if (score > bestScore) {
        bestScore = score;
        bestS = shift;
      }
    }
    return bestS;
  }

  function buildWhiteSegs(shift, W, imgW) {
    const segs = [];
    const i0 = Math.floor(-shift / W) - 1;
    const i1 = Math.ceil((imgW - shift) / W) + 1;
    for (let i = i0; i <= i1; i++) {
      const a = shift + i * W;
      const b = a + W;
      const c0 = Math.max(0, a);
      const c1 = Math.min(imgW, b);
      if (c1 - c0 >= W * 0.45) segs.push([c0, c1]);
    }
    return segs;
  }

  function buildBlackSegs(centers, bw, imgW) {
    const segs = [];
    for (let i = 0; i < centers.length; i++) {
      const x = centers[i];
      if (x < -bw * 0.2 || x > imgW + bw * 0.2) continue;
      const c0 = Math.max(0, x - bw / 2);
      const c1 = Math.min(imgW, x + bw / 2);
      if (c1 - c0 >= bw * 0.4) segs.push([c0, c1]);
    }
    return segs;
  }

  function narrowBlackWidth(runs) {
    const widths = runs.map(([a, b]) => b - a).sort((a, b) => a - b);
    if (!widths.length) return 0;
    const half = widths.slice(0, Math.max(1, Math.ceil(widths.length / 2)));
    return medianNum(half);
  }

  /** 黒鍵の幅は白鍵のおよそ半分。これと合わない白鍵幅は採用しない */
  function blackWidthAgrees(W, bw) {
    if (!(bw > 0) || !(W > 0)) return true;
    const ratio = bw / W;
    return ratio >= 0.34 && ratio <= 0.86;
  }

  function patternUnitSeeds(centers, hintW) {
    const seeds = [];
    const sorted = centers.slice().sort((a, b) => a - b);
    if (sorted.length >= 2) {
      let minGap = Infinity;
      for (let i = 1; i < sorted.length; i++) {
        minGap = Math.min(minGap, sorted[i] - sorted[i - 1]);
      }
      for (const div of [1, 2, 3, 4]) {
        const w = minGap / div;
        if (w >= 4) seeds.push(w);
      }
    }
    if (hintW >= 4) seeds.push(hintW);
    const span = sorted.length >= 2 ? sorted[sorted.length - 1] - sorted[0] : 0;
    const limit = Math.max(span * 1.25, hintW || 0);
    const out = [];
    for (const s of seeds) {
      if (s >= 4 && limit > 0 && s <= limit) {
        if (!out.some((u) => Math.abs(u - s) < s * 0.08)) out.push(s);
      }
    }
    return out;
  }

  function scoreOrigin(origin, W, upper, observed) {
    const blacks = predictBlackCenters(origin, W, upper.length).filter(
      (x) => x >= W * 0.15 && x <= upper.length - W * 0.15,
    );
    if (blacks.length < 2) return null;
    const shift = whiteShiftForBlacks(W, upper, blacks, false);
    let bright = 0;
    let nW = 0;
    for (let x = shift + W * 0.5; x < upper.length; x += W) {
      if (x < W * 0.15 || x > upper.length - W * 0.15) continue;
      bright += sampleProfile(upper, x);
      nW++;
    }
    if (nW < 3) return null;
    let dark = 0;
    let nDark = 0;
    let inliers = 0;
    for (let i = 0; i < observed.length; i++) {
      let best = Infinity;
      for (let j = 0; j < blacks.length; j++) {
        best = Math.min(best, Math.abs(blacks[j] - observed[i]));
      }
      if (best <= W * 0.35) {
        inliers++;
        dark += sampleProfile(upper, observed[i]);
        nDark++;
      }
    }
    if (!nDark) return null;
    const ratio = inliers / observed.length;
    if (ratio < 0.65) return null;
    let allDark = 0;
    for (let j = 0; j < blacks.length; j++) allDark += sampleProfile(upper, blacks[j]);
    const sepIn = bright / nW - dark / nDark;
    const sepAll = bright / nW - allDark / blacks.length;
    const sep = sepIn * 0.45 + sepAll * 0.55;
    return { sep, score: sep + ratio * 80, inliers, shift, blacks };
  }

  /**
   * 検出できた黒鍵の間隔を、2個・3個の繰り返しに合わせる。
   * 揃ったときは見えていない黒鍵も含めて、白鍵幅の格子上に全部置き直す。
   * @returns {{ whites: number[][], blacks: number[][] } | null}
   */
  function fitKeyboardPattern(observedRuns, upper, hintW) {
    const observed = observedRuns
      .map(([a, b]) => (a + b) / 2)
      .sort((a, b) => a - b);
    if (observed.length < 2) return null;
    const seeds = patternUnitSeeds(observed, hintW || 0);
    if (!seeds.length) return null;
    const bwObs = narrowBlackWidth(observedRuns);
    const imgW = upper.length;
    let best = null;
    const scales = [0.9, 0.95, 1, 1.05, 1.1];
    const idealW = bwObs > 0 ? bwObs / 0.58 : 0;
    const prefer = (scored, W) => {
      if (!blackWidthAgrees(W, bwObs)) return false;
      if (!best) return true;
      const r1 = scored.inliers / observed.length;
      const r0 = best.inliers / observed.length;
      if (r1 > r0 + 0.05) return true;
      if (r0 > r1 + 0.05) return false;
      if (idealW > 0) {
        const d1 = Math.abs(W - idealW);
        const d0 = Math.abs(best.W - idealW);
        if (d1 + 1 < d0) return true;
        if (d0 + 1 < d1) return false;
      }
      return scored.sep > best.sep;
    };
    for (let si = 0; si < seeds.length; si++) {
      for (let sc = 0; sc < scales.length; sc++) {
        const W = seeds[si] * scales[sc];
        if (W < 4 || imgW / W > 80 || W > imgW * 0.8) continue;
        if (!blackWidthAgrees(W, bwObs)) continue;
        const step = Math.max(1, W / 12);
        for (let origin = 0; origin < 7 * W; origin += step) {
          const scored = scoreOrigin(origin, W, upper, observed);
          if (!scored) continue;
          if (prefer(scored, W)) best = { ...scored, W, origin };
        }
      }
    }
    if (!best || best.sep < 8 || best.inliers < Math.min(2, observed.length)) return null;

    let origin = best.origin;
    let W = best.W;
    for (const dW of [-0.04, -0.02, 0, 0.02, 0.04]) {
      const Wt = W * (1 + dW);
      const oStep = Math.max(1, Wt / 24);
      for (let dO = -Wt * 0.12; dO <= Wt * 0.12; dO += oStep) {
        const scored = scoreOrigin(origin + dO, Wt, upper, observed);
        if (scored && prefer(scored, Wt)) {
          best = { ...scored, W: Wt, origin: origin + dO };
        }
      }
    }
    origin = best.origin;
    W = best.W;

    const predicted = predictBlackCenters(origin, W, imgW);
    const deltas = [];
    for (let i = 0; i < observed.length; i++) {
      let bestD = Infinity;
      for (let j = 0; j < predicted.length; j++) {
        const d = observed[i] - predicted[j];
        if (Math.abs(d) < Math.abs(bestD)) bestD = d;
      }
      if (Math.abs(bestD) <= W * 0.4) deltas.push(bestD);
    }
    if (deltas.length) origin += medianNum(deltas);

    const blacks = predictBlackCenters(origin, W, imgW).filter(
      (x) => x > -W * 0.15 && x < imgW + W * 0.15,
    );
    const shift = whiteShiftForBlacks(W, upper, blacks, true);
    let bw = narrowBlackWidth(observedRuns);
    if (!(bw >= W * 0.28 && bw <= W * 0.9)) bw = W * 0.58;
    const whites = buildWhiteSegs(shift, W, imgW);
    const blackSegs = buildBlackSegs(blacks, bw, imgW);
    if (whites.length < 3 || blackSegs.length < 2) return null;
    return { whites, blacks: blackSegs };
  }

  /** 同じ高さの半音列は、色が欠けていても 12 音の白黒パターンで種類を揃える */
  function forceChromaticKinds(runs, profile) {
    let bestPc = 0;
    let bestSep = -Infinity;
    for (let pc0 = 0; pc0 < 12; pc0++) {
      let sb = 0;
      let nb = 0;
      let sw = 0;
      let nw = 0;
      for (let i = 0; i < runs.length; i++) {
        const lum = segMeanProfile(profile, runs[i].a, runs[i].b);
        if (isBlackPitch(pc0 + i)) {
          sb += lum;
          nb++;
        } else {
          sw += lum;
          nw++;
        }
      }
      if (!nb || !nw) continue;
      const sep = sw / nw - sb / nb;
      if (sep > bestSep) {
        bestSep = sep;
        bestPc = pc0;
      }
    }
    if (bestSep < 8) return runs;
    return runs.map((r, i) => ({
      a: r.a,
      b: r.b,
      kind: isBlackPitch(bestPc + i) ? "black" : "white",
    }));
  }

  /**
   * 矩形内の映像から白鍵（全高）と黒鍵（上側）を返す。
   * 黒鍵が一部しか取れなくても、2個・3個の繰り返しに合うときは格子上に補完する。
   * @returns {{ keys: {nx:number,ny:number,nw:number,nh:number,kind:'white'|'black'}[], error: string }}
   */
  function detectPianoKeysFromImage(img, rect) {
    if (!img || img.width < 24 || img.height < 16) {
      return { keys: [], error: PIANO_DETECT_FAIL };
    }
    const { w, h, luma } = lumaFromImage(img);
    const lower = columnMean(luma, w, h, h * 0.80, h * 0.96);
    const upper = smoothArray(
      columnMean(luma, w, h, h * 0.08, h * 0.40),
      Math.max(1, Math.round(w / 400)),
    );
    const full = smoothArray(
      columnMean(luma, w, h, h * 0.06, h * 0.94),
      Math.max(1, Math.round(w / 400)),
    );
    const delta = new Float32Array(w);
    for (let x = 0; x < w; x++) delta[x] = lower[x] - upper[x];
    const deltaS = smoothArray(delta, Math.max(1, Math.round(w / 400)));
    const blackFound = findBlackRuns(deltaS);

    if (!blackFound.realistic) {
      const flat = segmentFlatKeys(full);
      if (!flat) return { keys: [], error: PIANO_DETECT_FAIL };
      const patterned = forceChromaticKinds(flat, full);
      const keys = patterned.map((r) => mapPixelSeg([r.a, r.b], rect, w, h, r.kind, 0, h));
      return keys.length >= 3 ? { keys, error: "" } : { keys: [], error: PIANO_DETECT_FAIL };
    }

    const gapWhites = findWhiteByGaps(lower);
    const roughW = gapWhites && gapWhites.length
      ? medianNum(gapWhites.map((s) => s[1] - s[0]))
      : estimateWhiteWidth(blackFound.runs, w);
    let blackRuns = filterBlackRuns(blackFound.runs, roughW);
    if (blackRuns.length < 2) blackRuns = filterBlackRuns(blackFound.runs, null);
    const fitted = fitKeyboardPattern(blackRuns, upper, roughW);
    let whites;
    if (fitted) {
      whites = fitted.whites;
      blackRuns = fitted.blacks;
    } else {
      const gridWhites = whitesFromBlackGrid(blackRuns, upper, w);
      whites = chooseWhiteSegments(gapWhites, gridWhites);
      if (!whites || whites.length < 3) return { keys: [], error: PIANO_DETECT_FAIL };
      const whiteW = medianNum(whites.map((s) => s[1] - s[0]));
      blackRuns = filterBlackRuns(blackRuns, whiteW);
    }
    const ratios = blackRuns.map(([a, b]) => blackHeightRatio(luma, w, h, a, b));
    const bh = ratios.length ? medianNum(ratios) : 0.62;
    const keys = [];
    for (const seg of whites) keys.push(mapPixelSeg(seg, rect, w, h, "white", 0, h));
    for (const seg of blackRuns) {
      keys.push(mapPixelSeg(seg, rect, w, h, "black", 0, h * bh));
    }
    if (keys.length < 3) return { keys: [], error: PIANO_DETECT_FAIL };
    return { keys, error: "" };
  }

  function readRangeImage(rect) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh || !video.srcObject) return null;
    let sx = Math.max(0, Math.floor(rect.nx * vw));
    let sy = Math.max(0, Math.floor(rect.ny * vh));
    let sw = Math.max(1, Math.round(rect.nw * vw));
    let sh = Math.max(1, Math.round(rect.nh * vh));
    if (sx >= vw || sy >= vh) return null;
    if (sx + sw > vw) sw = vw - sx;
    if (sy + sh > vh) sh = vh - sy;
    const maxPixels = 1920 * 1080;
    let dw = sw;
    let dh = sh;
    if (dw * dh > maxPixels) {
      const sc = Math.sqrt(maxPixels / (dw * dh));
      dw = Math.max(8, Math.round(dw * sc));
      dh = Math.max(8, Math.round(dh * sc));
    }
    sampleCv.width = dw;
    sampleCv.height = dh;
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(video, sx, sy, sw, sh, 0, 0, dw, dh);
    return sctx.getImageData(0, 0, dw, dh);
  }

  function recognizeKeysInRect(rect) {
    if (!video.srcObject || !video.videoWidth) {
      alert("先に画面を共有してください。");
      return;
    }
    const img = readRangeImage(rect);
    if (!img) {
      lblRangeResult.textContent = "映像を読み取れませんでした。";
      alert("映像を読み取れませんでした。画面共有を確認してください。");
      renderOverlay();
      return;
    }
    const found = detectPianoKeysFromImage(img, rect);
    if (!found.keys.length) {
      lblRangeResult.textContent = found.error;
      alert(found.error);
      renderOverlay();
      return;
    }
    abortMidiRecording();
    midiC4KeyId = null;
    keys = [];
    nextId = 1;
    const whites = found.keys.filter((k) => k.kind === "white");
    const blacks = found.keys.filter((k) => k.kind === "black");
    for (const k of whites) pushKeyNormalized(k.nx, k.ny, k.nw, k.nh, "white");
    for (const k of blacks) pushKeyNormalized(k.nx, k.ny, k.nw, k.nh, "black");
    syncKeyMidiNotesFromMap();
    nextId = keys.length ? Math.max(...keys.map((x) => x.id)) + 1 : 1;
    rangeDrawMode = false;
    rangeDraft = null;
    btnRangeDraw.textContent = "鍵盤範囲を指定: オフ";
    lblRangeResult.textContent = `認識: 白鍵 ${whites.length}、黒鍵 ${blacks.length}`;
    rebuildTable(Number(rngTh.value) || 28);
    syncOverlayCursorStyle();
    resizeOverlay();
    syncMidiRecButtons();
    syncPickC4Button();
  }

  overlay.addEventListener("pointerdown", (e) => {
    if (rangeDrawMode) {
      const p = clientToNormalizedClamped(e.clientX, e.clientY);
      if (!p) return;
      dragKind = "range";
      dragRef.nx0 = p.nx;
      dragRef.ny0 = p.ny;
      rangeDraft = { nx: p.nx, ny: p.ny, nw: 0, nh: 0 };
      overlay.setPointerCapture(e.pointerId);
      syncOverlayCursorStyle();
      renderOverlay();
      return;
    }

    const { lx, ly } = pointerOnStage(e.clientX, e.clientY);
    const hit = hitTest(lx, ly);

    if (pickC4Mode && keys.length) {
      if (hit && (hit.type === "move" || hit.type === "resize")) {
        applyC4Anchor(keys[hit.index]);
        setPickC4Mode(false);
        renderOverlay();
      }
      return;
    }

    if (groupMoveKeys && keys.length && hit && hit.type === "move") {
      dragKind = "moveGroup";
      resizeHandle = null;
      dragRef.ix = -1;
      dragRef.snapForGroup = keys.map((k) => ({ nx: k.nx, ny: k.ny }));
      dragRef.startClientX = e.clientX;
      dragRef.startClientY = e.clientY;
      activeIndex = hit.index;
      overlay.setPointerCapture(e.pointerId);
