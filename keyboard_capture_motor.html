      syncOverlayCursorStyle();
      renderOverlay();
      return;
    }

    if (hit && showKeyHandles) {
      if (hit.type === "resize") {
        dragKind = "resize";
        resizeHandle = hit.handle;
        dragRef.ix = hit.index;
        dragRef.startClientX = e.clientX;
        dragRef.startClientY = e.clientY;
        const k = keys[hit.index];
        dragRef.nx0 = k.nx;
        dragRef.ny0 = k.ny;
        dragRef.nw0 = k.nw;
        dragRef.nh0 = k.nh;
        activeIndex = hit.index;
      } else if (hit.type === "move") {
        dragKind = "move";
        dragRef.ix = hit.index;
        dragRef.startClientX = e.clientX;
        dragRef.startClientY = e.clientY;
        const k = keys[hit.index];
        dragRef.nx0 = k.nx;
        dragRef.ny0 = k.ny;
        activeIndex = hit.index;
      }
      overlay.setPointerCapture(e.pointerId);
      renderOverlay();
    }
  });

  overlay.addEventListener("pointermove", (e) => {
    if (dragKind === "range") {
      const p = clientToNormalizedClamped(e.clientX, e.clientY);
      if (p) {
        rangeDraft = rectFromPoints(dragRef.nx0, dragRef.ny0, p.nx, p.ny);
        renderOverlay();
      }
      return;
    }
    const Lnm = stageToNormalized(e.clientX, e.clientY);
    if (dragKind === "moveGroup" && dragRef.snapForGroup) {
      const Lmv = videoLayout();
      if (Lmv) {
        const dnx = (e.clientX - dragRef.startClientX) / Lmv.rw;
        const dny = (e.clientY - dragRef.startClientY) / Lmv.rh;
        for (let i = 0; i < keys.length; i++) {
          keys[i].nx = dragRef.snapForGroup[i].nx + dnx;
          keys[i].ny = dragRef.snapForGroup[i].ny + dny;
        }
        renderOverlay();
      }
      return;
    }
    if ((dragKind === "move" || dragKind === "resize") && Lnm && dragRef.ix >= 0) {
      const k = keys[dragRef.ix];
      const L = Lnm.L;
      const dnx = (e.clientX - dragRef.startClientX) / L.rw;
      const dny = (e.clientY - dragRef.startClientY) / L.rh;
      if (dragKind === "move") {
        k.nx = dragRef.nx0 + dnx;
        k.ny = dragRef.ny0 + dny;
        k.nx = Math.max(0, Math.min(1 - k.nw, k.nx));
        k.ny = Math.max(0, Math.min(1 - k.nh, k.ny));
      } else {
        let nx = dragRef.nx0;
        let ny = dragRef.ny0;
        let nw = dragRef.nw0;
        let nh = dragRef.nh0;
        if (resizeHandle.includes("w")) {
          nx = dragRef.nx0 + dnx;
          nw = dragRef.nw0 - dnx;
        }
        if (resizeHandle.includes("e")) nw = dragRef.nw0 + dnx;
        if (resizeHandle.includes("n")) {
          ny = dragRef.ny0 + dny;
          nh = dragRef.nh0 - dny;
        }
        if (resizeHandle.includes("s")) nh = dragRef.nh0 + dny;
        nw = Math.max(0.01, nw);
        nh = Math.max(0.01, nh);
        if (nw > 1) nw = 1;
        if (nh > 1) nh = 1;
        if (nx < 0) { nw += nx; nx = 0; nw = Math.max(0.01, nw); }
        if (ny < 0) { nh += ny; ny = 0; nh = Math.max(0.01, nh); }
        if (nx + nw > 1) nw = Math.max(0.01, 1 - nx);
        if (ny + nh > 1) nh = Math.max(0.01, 1 - ny);
        k.nx = nx;
        k.ny = ny;
        k.nw = nw;
        k.nh = nh;
      }
      renderOverlay();
    }
  });

  overlay.addEventListener("pointerup", (e) => {
    if (dragKind === "range") {
      const draft = rangeDraft;
      dragKind = null;
      rangeDraft = null;
      ignoreNextDblClick = !!(draft && (draft.nw >= 0.004 || draft.nh >= 0.004));
      if (overlay.hasPointerCapture(e.pointerId)) overlay.releasePointerCapture(e.pointerId);
      syncOverlayCursorStyle();
      if (draft && draft.nw >= 0.012 && draft.nh >= 0.012) recognizeKeysInRect(draft);
      else renderOverlay();
      return;
    }

    overlay.releasePointerCapture(e.pointerId);

    dragKind = null;
    resizeHandle = null;
    dragRef.ix = -1;
    dragRef.snapForGroup = null;
    syncOverlayCursorStyle();
    renderOverlay();
  });

  overlay.addEventListener("dblclick", (e) => {
    if (rangeDrawMode || ignoreNextDblClick) {
      ignoreNextDblClick = false;
      return;
    }
    const { lx, ly } = pointerOnStage(e.clientX, e.clientY);
    const hit = hitTest(lx, ly);
    if (hit && (hit.type === "move" || hit.type === "resize")) {
      const k = keys[hit.index];
      k.kind = k.kind === "white" ? "black" : "white";
      rebuildTable(Number(rngTh.value) || 28);
      renderOverlay();
    }
  });

  btnGroupMoveToggle.addEventListener("click", () => {
    groupMoveKeys = !groupMoveKeys;
    btnGroupMoveToggle.textContent = groupMoveKeys ? "グループ位置: オン" : "グループ位置: オフ";
    syncOverlayCursorStyle();
    renderOverlay();
  });

  btnKeyHandlesToggle.addEventListener("click", () => {
    showKeyHandles = !showKeyHandles;
    btnKeyHandlesToggle.textContent = showKeyHandles ? "鍵を微調整: オン" : "鍵を微調整: オフ";
    syncOverlayCursorStyle();
    renderOverlay();
  });

  btnClearRects.addEventListener("click", () => {
    abortMidiRecording();
    midiC4KeyId = null;
    keys = [];
    rebuildTable(Number(rngTh.value) || 28);
    syncOverlayCursorStyle();
    resizeOverlay();
    syncMidiRecButtons();
    syncPickC4Button();
  });

  btnRangeDraw.addEventListener("click", () => {
    if (!rangeDrawMode) {
      if (!video.srcObject || !video.videoWidth) {
        alert("先に画面を共有してください。");
        return;
      }
      if (pickC4Mode) setPickC4Mode(false);
    }
    rangeDrawMode = !rangeDrawMode;
    rangeDraft = null;
    btnRangeDraw.textContent = rangeDrawMode ? "鍵盤範囲を指定: オン" : "鍵盤範囲を指定: オフ";
    syncOverlayCursorStyle();
    renderOverlay();
  });

  btnMidiRecStart.addEventListener("click", startMidiRecording);
  btnMidiRecStop.addEventListener("click", stopMidiRecordingAndExport);

  btnPickC4.addEventListener("click", () => {
    if (!keys.length) {
      alert("鍵を生成または JSON から読み込んでから使ってください。");
      return;
    }
    setPickC4Mode(!pickC4Mode);
  });

  function exportJson() {
    syncKeyMidiNotesFromMap();
    const data = {
      version: 6,
      refs: {
        white: [Number(numWr.value), Number(numWg.value), Number(numWb.value)],
        black: [Number(numBr.value), Number(numBg.value), Number(numBb.value)],
      },
      threshold: Number(rngTh.value) || 28,
      keys: keys.map(({ nx, ny, nw, nh, kind, id, midiNote }) => {
        const o = { nx, ny, nw, nh, kind, id };
        if (midiNote != null && Number.isFinite(midiNote))
          o.midiNote = clampMidi(midiNote);
        return o;
      }),
      stripeForm: {
        startSemi: Math.max(
          0,
          Math.min(11, Math.floor(Number(selStripeStart.value))),
        ),
      },
    };
    if (midiC4KeyId != null) data.midiC4KeyId = midiC4KeyId;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "keyboard_map.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  btnExport.addEventListener("click", exportJson);

  btnMidiConnect.addEventListener("click", async () => {
    if (realtimeMidiEnabled) {
      disconnectMidiDevice();
    } else {
      const success = await initWebMidi();
      if (success) {
        btnMidiConnect.textContent = "MIDI 切断";
      }
    }
  });

  btnArduinoConnect.addEventListener("click", () => { void connectSerial(); });
  btnArduinoDisconnect.addEventListener("click", () => { void disconnectSerial(); });
  btnArduinoReset.addEventListener("click", () => { void resetArduino(); });

  if (!navigator.serial) {
    updateStatusSerial("error", "Web Serial API 未サポート（Chrome / Edge 推奨）");
  }

  fileImport.addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const text = await f.text();
    try {
      const data = JSON.parse(text);
      const v = data.version;
      if (v !== 1 && v !== 2 && v !== 3 && v !== 4 && v !== 5 && v !== 6) throw new Error("version");

      if (data.stripeForm && typeof data.stripeForm === "object") {
        const sf = data.stripeForm;
        if (typeof sf.startSemi === "number" && Number.isFinite(sf.startSemi)) {
          selStripeStart.value = String(Math.max(0, Math.min(11, Math.floor(sf.startSemi))));
        }
      }

      keys = (data.keys || []).map((k) => {
        const key = {
          nx: k.nx,
          ny: k.ny,
          nw: k.nw,
          nh: k.nh,
          kind: k.kind === "black" ? "black" : "white",
          id: k.id ?? nextId++,
        };
        if (typeof k.midiNote === "number" && Number.isFinite(k.midiNote))
          key.midiNote = clampMidi(k.midiNote);
        return key;
      });

      nextId = keys.length ? Math.max(...keys.map((x) => x.id)) + 1 : 1;

      midiC4KeyId = null;
      if (typeof data.midiC4KeyId === "number" && Number.isFinite(data.midiC4KeyId)) {
        const cid = Math.round(data.midiC4KeyId);
        if (keys.some((x) => x.id === cid)) midiC4KeyId = cid;
      }

      if (data.threshold != null) {
        rngTh.value = String(data.threshold);
        lblTh.textContent = String(data.threshold);
      }
      const rw = data.refs && data.refs.white;
      const rb = data.refs && data.refs.black;
      if (rw && rw.length === 3) {
        numWr.value = rw[0]; numWg.value = rw[1]; numWb.value = rw[2];
        colWhite.value = rgbToHex(Number(rw[0]), Number(rw[1]), Number(rw[2]));
      }
      if (rb && rb.length === 3) {
        numBr.value = rb[0]; numBg.value = rb[1]; numBb.value = rb[2];
        colBlack.value = rgbToHex(Number(rb[0]), Number(rb[1]), Number(rb[2]));
      }
      rebuildTable(Number(rngTh.value) || 28);
      syncKeyMidiNotesFromMap();
      syncOverlayCursorStyle();
      resizeOverlay();
      syncMidiRecButtons();
      syncPickC4Button();
    } catch {
      alert("JSON の読み込みに失敗しました（version 1〜6 形式のみ対応）。");
    }
    ev.target.value = "";
  });

  async function startShare() {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          frameRate: { ideal: 60, max: 60 },
        },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      btnShare.disabled = true;
      btnStop.disabled = false;
      resizeOverlay();
      stream.getVideoTracks()[0].addEventListener("ended", () => stopShare());
      loop();
      syncMidiRecButtons();
      syncPickC4Button();
    } catch (err) {
      alert("共有を開始できませんでした（キャンセルまたは未対応）。\n" + (err && err.message ? err.message : ""));
      console.error(err);
    }
  }

  function stopShare() {
    abortMidiRecording();
    disconnectMidiDevice();
    void disconnectSerial();
    cancelMeasureLoop();
    dragKind = null;
    resizeHandle = null;
    dragRef.ix = -1;
    dragRef.snapForGroup = null;
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    video.srcObject = null;
    btnShare.disabled = false;
    btnStop.disabled = true;
    syncOverlayCursorStyle();
    resizeOverlay();
  }

  btnShare.addEventListener("click", startShare);
  btnStop.addEventListener("click", stopShare);

  window.addEventListener("resize", () => resizeOverlay());
  video.addEventListener("loadedmetadata", () => resizeOverlay());

  let stageResizeQueued = false;
  function scheduleStageResizeOverlay() {
    if (stageResizeQueued) return;
    stageResizeQueued = true;
    requestAnimationFrame(() => {
      stageResizeQueued = false;
      resizeOverlay();
    });
  }
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => scheduleStageResizeOverlay()).observe(stage);
  }

  let raf = 0;
  let vfcHandle = 0;

  function cancelMeasureLoop() {
    cancelAnimationFrame(raf);
    raf = 0;
    if (vfcHandle && typeof video.cancelVideoFrameCallback === "function") {
      video.cancelVideoFrameCallback(vfcHandle);
    }
    vfcHandle = 0;
  }

  function loop() {
    cancelMeasureLoop();
    function tickRaf() {
      if (!video.srcObject) return;
      measureKeys();
      raf = requestAnimationFrame(tickRaf);
    }
    function tickVfc() {
      if (!video.srcObject) return;
      measureKeys();
      vfcHandle = video.requestVideoFrameCallback(tickVfc);
    }
    if (typeof video.requestVideoFrameCallback === "function") {
      vfcHandle = video.requestVideoFrameCallback(tickVfc);
    } else {
      raf = requestAnimationFrame(tickRaf);
    }
  }

  /** 初期空白の表 */
  rebuildTable(Number(rngTh.value) || 28);
  resizeOverlay();
  syncOverlayCursorStyle();
  syncMidiRecButtons();
  syncPickC4Button();
})();
  </script>
</body>
</html>
